[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-hardener"
version = "0.6.0"
description = "Beginner-friendly Linux hardening and compliance toolkit"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
linux-hardener = "hardener.cli:main"
linux-hardener-api = "hardener.api:main"
linux-hardener-agent = "hardener.agent:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["hardener*"]

[tool.setuptools.package-data]
hardener = ["static/*"]
